# Helm values for kube-prometheus-stack on a local Kind cluster.
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
#
# Kept small on purpose so it fits on a laptop. Do NOT put passwords here.

alertmanager:
  enabled: false            # not needed for right-sizing experiments

# Kind does not expose these control-plane endpoints; scraping them only
# creates "down" targets and noise.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from any namespace, not only ones labelled
    # with this Helm release. Needed for our sample-app ServiceMonitor.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

grafana:
  # Admin password is generated into the Secret "monitoring-grafana".
  # Read it with:
  #   kubectl -n monitoring get secret monitoring-grafana \
  #     -o jsonpath='{.data.admin-password}' | base64 -d
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
